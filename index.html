<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>typekr — 한글 타자기</title>
<style>
@font-face{font-family:'DXType';src:url(fonts/DXTypeB.woff2) format('woff2'),url(fonts/DXTypeB.woff) format('woff');font-display:block}
:root{--ink:#1c1a1e;--red:#a3221b;
  --chrome:linear-gradient(180deg,#fdfdfd 0%,#cfd2d4 18%,#7d8184 45%,#e9ecee 62%,#a3a7aa 85%,#5f6366 100%)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overflow-x:hidden}
body{min-height:100vh;position:relative;color:#eee;font-family:'DXType','Batang',serif;overflow-x:hidden;user-select:none;-webkit-user-select:none;
  background:#3b2a1d;background-image:repeating-linear-gradient(92deg,rgba(0,0,0,.08) 0 2px,transparent 2px 9px),repeating-linear-gradient(88deg,rgba(255,220,180,.04) 0 1px,transparent 1px 23px),radial-gradient(ellipse at 50% 30%,#7a5636 0%,#3b2a1d 75%)}
#scaler{position:relative;margin:0 auto;padding-top:6px}
#machine{position:absolute;left:0;top:0;width:1000px;height:956px;transform-origin:0 0}

/* ---------- 종이 ---------- */
#carriage{position:absolute;left:0;top:0;will-change:transform;z-index:2;contain:layout style}
#table{position:absolute;clip-path:polygon(9% 0,91% 0,100% 100%,0 100%);background:linear-gradient(180deg,#5c615f,#2b2f2e 70%,#1d201f);box-shadow:inset 0 2px 0 #fff3}
#table::after{content:'';position:absolute;inset:18px 16%;background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(0,0,0,.35) 46px 50px)}
#clip{position:absolute;left:0;top:0;overflow:hidden}
#paper{position:absolute;left:0;top:0;box-shadow:0 0 14px rgba(0,0,0,.5);will-change:transform;overflow:hidden;contain:layout paint}
#paper.p-bs{background-color:#f2eee3}
#paper.p-gj{background-color:#d8caa6}
#paper.p-gw{background-color:#efe9d8}
#paper.p-cb{background-color:#e9e7df}
#tex,#form{position:absolute;inset:0;pointer-events:none;contain:strict}
#form{color:#a2412c;font-family:'DXType',serif}
#form .hl{position:absolute;left:0;right:0;height:1px;background:rgba(162,65,44,.42)}
#form .vl{position:absolute;top:0;width:1px;background:rgba(162,65,44,.55)}
#form .lb{position:absolute;font-size:13px;letter-spacing:4px;white-space:nowrap}
#form .tt{position:absolute;left:0;right:0;text-align:center;font-size:26px;letter-spacing:22px}
#ink{position:absolute;left:0;top:0;pointer-events:none}

/* ---------- 캐리지 ---------- */
#platen{position:absolute;height:62px;border-radius:30px/31px;background:linear-gradient(180deg,#000 0%,#2c2c2c 16%,#4a4a4a 26%,#1e1e1e 50%,#0a0a0a 78%,#000 100%);box-shadow:0 8px 12px rgba(0,0,0,.55)}
.knob{position:absolute;width:52px;height:84px;border-radius:14px;background:linear-gradient(90deg,#0c0c0c,#555 38%,#222 62%,#000);box-shadow:0 6px 10px #0008}
.knob::after{content:'';position:absolute;inset:9px 7px;border-radius:9px;background:repeating-linear-gradient(0deg,#2e2e2e 0 3px,#0e0e0e 3px 6px)}
.knob::before{content:'';position:absolute;top:30px;width:16px;height:24px;background:var(--chrome);border-radius:3px}
.knob.l::before{right:-14px}.knob.r::before{left:-14px}
#bail{position:absolute;height:7px;border-radius:4px;background:var(--chrome);box-shadow:0 2px 3px #0009}
#bail i{position:absolute;top:-4px;width:26px;height:15px;border-radius:7px;background:linear-gradient(#333,#0a0a0a)}
#scale{position:absolute;height:20px;border-radius:3px;background:var(--chrome);box-shadow:0 2px 3px #0008;overflow:hidden}
#scale span{position:absolute;bottom:0;width:1px;background:#222}
#scale b{position:absolute;top:0;font:9px/10px Arial,sans-serif;color:#111;transform:translateX(-50%)}
#rail{position:absolute;height:14px;border-radius:3px;background:linear-gradient(#3b3b3b,#0c0c0c)}
#lever{position:absolute;width:150px;height:15px;border-radius:8px;cursor:pointer;background:var(--chrome);box-shadow:0 4px 6px rgba(0,0,0,.6);transform-origin:right center;transform:rotate(-16deg)}
#lever::before{content:'';position:absolute;left:-18px;top:-9px;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#999 55%,#444)}
#lever.pull{animation:pull .38s}
@keyframes pull{40%{transform:rotate(-38deg)}}
#rel{position:absolute;width:16px;height:70px;border-radius:8px;background:var(--chrome);box-shadow:0 3px 5px #0008;transform:rotate(14deg)}
#stage.shake #carriage{animation:shake .18s}
@keyframes shake{25%{margin-left:-3px}75%{margin-left:3px}}

/* ---------- 몸체 (기종별 색) ---------- */
#machine{--body:#1c1c1c;--body2:#0d0d0d;--trim:#b8913f}
#machine[data-m=k4]{--body:#8aa39c;--body2:#5f7a73;--trim:#d9d9d2}
#machine[data-m=e2]{--body:#d9d0bb;--body2:#b8ad95;--trim:#8a7f6a}
.paint{background-color:var(--body);background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.5px),radial-gradient(rgba(0,0,0,.25) 1px,transparent 1.6px),linear-gradient(180deg,var(--body),var(--body2));background-size:4px 4px,5px 5px,100% 100%}
#machine[data-m=e2] .paint{background-image:linear-gradient(180deg,#e6dfcd,var(--body) 40%,var(--body2))}
#hood{position:absolute;left:40px;top:416px;width:920px;height:190px;border-radius:170px 170px 0 0/110px 110px 0 0;z-index:1;box-shadow:inset 0 3px 0 rgba(255,255,255,.18),inset 0 -20px 30px rgba(0,0,0,.25)}
#machine[data-m=k3] #hood{box-shadow:inset 0 3px 0 rgba(255,255,255,.18),inset 0 -20px 30px rgba(0,0,0,.25),inset 0 0 0 14px var(--body),inset 0 0 0 16px var(--trim)}
#machine[data-m=e2] #hood{border-radius:40px 40px 0 0;height:180px}
#seg{position:absolute;left:200px;top:0;width:520px;height:160px;border-radius:0 0 260px 260px/0 0 160px 160px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 0%,#252525 0%,#060606 70%);box-shadow:inset 0 0 0 4px #1a1a1a,0 2px 0 rgba(255,255,255,.15)}
#machine[data-m=e2] #seg,#machine[data-m=e2] .spool,#machine[data-m=e2] #rib,#machine[data-m=e2] #abar,#machine[data-m=e2] #lever,#machine[data-m=e2] #ribbon{display:none}
#machine:not([data-m=e2]) #lcd,#machine:not([data-m=e2]) #wheel,#machine:not([data-m=e2]) #cass{display:none}
#lcd{position:absolute;left:290px;top:60px;width:340px;height:58px;border-radius:6px;padding:7px 12px;background:#1d1f19;box-shadow:inset 0 0 0 3px #8a826f,inset 0 3px 8px #000}
#lcd div{height:44px;border-radius:3px;background:linear-gradient(#a9b394,#8f9c7c);color:#1e2618;font-size:22px;line-height:44px;padding:0 8px;white-space:pre;overflow:hidden;text-align:right;font-family:'DXType',monospace;box-shadow:inset 0 2px 5px #0006}
#lcd small{position:absolute;right:14px;top:-18px;font:10px Arial,sans-serif;color:#5d5444;letter-spacing:2px}
.spool{position:absolute;width:132px;height:132px;border-radius:50%;z-index:4;
  background:radial-gradient(circle,#ddd 0 9px,#555 10px 13px,#151515 14px 40px,#2a2a2a 41px 44px,#141414 45px 54px,transparent 55px),var(--chrome);
  box-shadow:0 6px 10px #000a,inset 0 0 0 3px #888}
.spool::after{content:'';position:absolute;left:62px;top:20px;width:8px;height:22px;background:#bbb;border-radius:2px;box-shadow:0 70px 0 #bbb}
.spool.turn{animation:spin .5s linear}
@keyframes spin{to{transform:rotate(30deg)}}
#machine[data-m=k4] .spool{width:112px;height:112px;margin:10px;background:radial-gradient(circle,#ccc 0 8px,#444 9px 12px,#141414 13px 34px,#292929 35px 38px,#141414 39px 46px,transparent 47px),linear-gradient(#e4e4e0,#9a9a94)}
#machine[data-m=k4] .spool::after{left:52px;top:16px;box-shadow:0 58px 0 #bbb}
#rib{position:absolute;left:0;top:0;z-index:3;pointer-events:none}
#guide{position:absolute;left:500px;width:0;height:0;z-index:6;pointer-events:none}
#guide .ear{position:absolute;top:14px;width:13px;height:30px;background:linear-gradient(90deg,rgba(180,190,190,.55),rgba(255,255,255,.85) 50%,rgba(150,160,160,.55));border-radius:3px 3px 6px 6px;box-shadow:0 0 0 1px #6669}
#guide .ear.l{left:-36px}#guide .ear.r{left:23px}
#guide .mark{position:absolute;left:-1px;top:16px;width:2px;height:9px;background:#e73}
#ribbon{position:absolute;left:-21px;width:42px;height:15px;top:22px;background:linear-gradient(#111 0 50%,#9e1a14 50% 100%);border-radius:2px;transition:transform 55ms}
#ribbon.hit{transform:translateY(-19px)}
#cass{position:absolute;left:-70px;top:34px;width:140px;height:60px;border-radius:6px;background:linear-gradient(#2a2a2a,#111);box-shadow:0 4px 8px #000a}
#cass::after{content:'';position:absolute;left:44px;top:-6px;width:52px;height:12px;background:#151515;border-radius:2px}
#wheel{position:absolute;left:-40px;top:10px;width:80px;height:80px;border-radius:50%;opacity:.95;transition:transform 70ms;
  background:repeating-conic-gradient(#d8d4c8 0 3deg,transparent 3deg 9deg),radial-gradient(circle,#333 0 10px,#e8e4d8 11px 16px,transparent 17px)}
#abar{position:absolute;left:0;top:0;z-index:5;pointer-events:none}
#front{position:absolute;left:18px;top:566px;width:964px;height:372px;border-radius:26px 26px 70px 70px/26px 26px 50px 50px;z-index:1;
  box-shadow:0 26px 40px rgba(0,0,0,.65),inset 0 3px 0 rgba(255,255,255,.15),inset 0 -14px 24px rgba(0,0,0,.35)}
#machine[data-m=k3] #front{box-shadow:0 26px 40px rgba(0,0,0,.65),inset 0 0 0 10px var(--body),inset 0 0 0 12px var(--trim),inset 0 -14px 24px rgba(0,0,0,.35)}
#machine[data-m=k4] #front{background:linear-gradient(#d8d3c2,#b9b4a2)}
#machine[data-m=e2] #front{border-radius:18px 18px 30px 30px}
#plate{position:absolute;left:50%;top:-24px;transform:translateX(-50%);padding:6px 26px 5px;border-radius:7px;z-index:3;text-align:center;line-height:1.05;white-space:nowrap;
  background:linear-gradient(#f0d995,#a8833a 52%,#e0c070);color:#3a2a0c;box-shadow:inset 0 1px 0 #fff8,0 3px 5px #0009}
#machine[data-m=k4] #plate{background:var(--chrome);color:#1c2a27}
#machine[data-m=e2] #plate{background:#3a332a;color:#e8dcc0;top:-18px;border-radius:3px}
#plate b{display:block;font-size:24px;letter-spacing:4px}#plate small{font-size:10px;letter-spacing:4px}
.foot{position:absolute;bottom:-14px;width:90px;height:22px;border-radius:0 0 14px 14px;background:#151515}
#kb{position:absolute;left:46px;top:46px;width:872px;height:298px;border-radius:18px;z-index:0;background:linear-gradient(#0d100d,#1f261e 40%,#262e25);box-shadow:inset 0 10px 20px #000c}
#machine[data-m=k4] #kb{background:linear-gradient(#5b6c66,#7d8f89)}
#machine[data-m=e2] #kb{background:linear-gradient(#9a8f78,#b5aa92);box-shadow:inset 0 4px 10px #0007}
.row{position:absolute;display:flex;gap:9px}
.k{position:relative;width:54px;height:54px;border-radius:50%;cursor:pointer;flex:none;top:0;
  background:radial-gradient(circle at 50% 38%,#303030,#0a0a0a 68%);
  box-shadow:0 0 0 4px #d6d9db,0 0 0 5px #5a5d5f,0 0 0 6px #b5b9bb,0 8px 6px 2px #000b;transition:top 45ms;
  display:flex;align-items:center;justify-content:center;color:#f4f0e2}
.k::before{content:'';position:absolute;inset:5px;border-radius:50%;background:radial-gradient(ellipse at 50% 22%,rgba(255,255,255,.22),transparent 55%)}
.k::after{content:'';position:absolute;left:50%;bottom:50%;width:7px;margin-left:-3.5px;height:80px;z-index:-1;background:linear-gradient(90deg,#050505,#4a4a4a 50%,#050505)}
#machine[data-m=k4] .k{border-radius:12px;background:linear-gradient(#3e4f4a,#26332f);box-shadow:0 0 0 2px #1b2421,0 7px 0 #141b19,0 9px 6px #000a}
#machine[data-m=k4] .k::before{border-radius:9px;inset:4px;background:linear-gradient(rgba(255,255,255,.12),transparent 60%)}
#machine[data-m=e2] .k{border-radius:5px;width:56px;height:50px;background:linear-gradient(#5b4b3d,#3d3127);box-shadow:0 5px 0 #2a211a,0 6px 4px #0008;color:#efe6d2}
#machine[data-m=e2] .k::before{border-radius:4px;inset:3px;background:linear-gradient(rgba(255,255,255,.1),transparent 50%)}
#machine[data-m=e2] .k::after{display:none}
#machine[data-m=e2] .k.wide{width:94px;background:linear-gradient(#e6dcc5,#c6b99c);color:#3a3024;box-shadow:0 5px 0 #8f846c,0 6px 4px #0007}
.k .m{font-size:21px;line-height:1}
.k .sh{position:absolute;top:7px;left:11px;font-size:11px;color:#bbb}
.k .en{position:absolute;bottom:6px;right:11px;font-size:10px;color:#9a9}
.k .m.c-j{color:#a6e0a8}.k .m.c-v,.k .m.c-d{color:#f6d27a}.k .sh.c-j{color:#a6e0a8}
.k .m.c-d::after{content:'';position:absolute;left:50%;bottom:9px;width:14px;margin-left:-7px;height:2px;background:#f6d27a}
.k.down{top:6px}
.k.wide{border-radius:27px;width:92px}.k.wide .m{font-size:14px}
#machine[data-m=k4] .k.wide{border-radius:12px}
.k.lit{box-shadow:0 0 0 4px #f6a64a,0 0 0 5px #5a5d5f,0 0 0 6px #b5b9bb,0 8px 6px 2px #000b}
#machine[data-m=k4] .k.lit,#machine[data-m=e2] .k.lit{box-shadow:0 0 0 3px #f6a64a,0 6px 0 #141b19}
#space{position:absolute;left:250px;top:262px;width:400px;height:22px;border-radius:11px;cursor:pointer;background:var(--chrome);box-shadow:0 6px 6px #000b;transition:top 45ms}
#machine[data-m=k4] #space{background:linear-gradient(#3e4f4a,#26332f);height:26px;border-radius:8px}
#machine[data-m=e2] #space{background:linear-gradient(#5b4b3d,#3d3127);height:30px;border-radius:5px;top:256px}
#space.down{top:267px}
#space::before,#space::after{content:'';position:absolute;bottom:14px;width:12px;height:40px;z-index:-1;background:linear-gradient(90deg,#222,#777,#222)}
#space::before{left:40px}#space::after{right:40px}
#machine[data-m=e2] #space::before,#machine[data-m=e2] #space::after{display:none}

/* ---------- 조작판 ---------- */
#desk{max-width:1000px;margin:0 auto;padding:4px 10px 24px;text-align:center}
#tags{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
.tag{display:inline-block;font-size:14px;color:#3a2a14;background:#efe6cf;padding:5px 14px;border-radius:3px;box-shadow:0 2px 4px #0007;transform:rotate(-.6deg)}
#pend{min-width:60px;transform:rotate(.8deg)}
#ctrls{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center}
.btn,select{font:inherit;font-size:13px;color:#eee;background:linear-gradient(#2a2a2a,#111);border:1px solid #000;border-radius:6px;padding:6px 10px;cursor:pointer;box-shadow:0 2px 0 #000,inset 0 1px 0 #fff2}
select{appearance:none;-webkit-appearance:none;padding-right:24px;background-image:linear-gradient(45deg,transparent 50%,#fc6 50%),linear-gradient(135deg,#fc6 50%,transparent 50%),linear-gradient(#5a3e14,#2e1f08);background-position:calc(100% - 14px) 50%,calc(100% - 9px) 50%,0 0;background-size:5px 5px,5px 5px,100% 100%;background-repeat:no-repeat;max-width:100%}
.btn:active{transform:translateY(2px);box-shadow:inset 0 1px 0 #fff2}
.btn .lamp{display:inline-block;width:8px;height:8px;border-radius:50%;background:#431;margin-right:5px;vertical-align:1px}
.btn.on .lamp{background:#f93;box-shadow:0 0 8px #f93}
.grp{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:8px}
#msg{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#000d;color:#fc6;padding:7px 16px;border-radius:6px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;z-index:99}
#msg.show{opacity:1}
#hint{color:#d9c7a6;font-size:13px;margin-top:12px;line-height:1.75}
#hint kbd{font-family:inherit;background:#111;border:1px solid #000;border-radius:4px;padding:0 5px;color:#eee}
#hint .c-j{color:#a6e0a8}#hint .c-v{color:#f6d27a}
#ta{position:fixed;left:0;bottom:0;width:1px;height:1px;opacity:0;font-size:16px;border:0;padding:0;resize:none}
</style>
</head>
<body>
<div id="msg"></div>
<div id="scaler">
 <div id="machine" data-m="k3">
  <div id="stage">
   <div id="carriage">
    <div id="table"></div>
    <div id="clip"><div id="paper"><div id="tex"></div><div id="form"></div><canvas id="ink"></canvas></div></div>
    <div id="platen"></div>
    <div class="knob l" id="kl"></div><div class="knob r" id="kr"></div>
    <div id="bail"><i style="left:24%"></i><i style="right:24%"></i></div>
    <div id="scale"></div>
    <div id="rail"></div>
    <div id="lever" title="줄바꿈 레버 (Enter)"></div>
    <div id="rel"></div>
   </div>
  </div>
  <div id="hood" class="paint"><div id="seg"><svg id="fan" width="520" height="160"></svg></div><div id="lcd"><small>MEMORY · LCD</small><div id="lcdt"></div></div></div>
  <div class="spool" id="sp1" style="left:150px;top:430px"></div>
  <div class="spool" id="sp2" style="left:718px;top:430px"></div>
  <svg id="rib" width="1000" height="600"></svg>
  <svg id="abar" width="1000" height="700"><line id="abl" x1="0" y1="0" x2="0" y2="0" stroke="#c9c9c9" stroke-width="5" stroke-linecap="round" opacity="0"/><rect id="abs" width="12" height="16" x="-6" y="-8" fill="#2a2a2a" opacity="0"/></svg>
  <div id="guide"><div id="cass"></div><div id="wheel"></div><div class="ear l"></div><div class="ear r"></div><div id="ribbon"></div><div class="mark"></div></div>
  <div id="front" class="paint">
   <div id="plate"><b id="pl1">한글타자기</b><small id="pl2">TYPEKR</small></div>
   <div id="kb"></div>
   <div class="foot" style="left:60px"></div><div class="foot" style="right:60px"></div>
  </div>
 </div>
</div>
<div id="desk">
 <div id="tags"><span class="tag" id="status"></span><span class="tag" id="pend"></span></div>
 <div class="grp">
  <select id="sModel" title="기종">
   <option value="k3">공병우형 세벌식 수동 타자기 (1950년대)</option>
   <option value="k4">클로버형 네벌식 수동 타자기 (1970년대 표준 자판)</option>
   <option value="e2">전자 타자기 두벌식 (1980년대)</option>
  </select>
  <select id="sInput" title="입력 방식">
   <option value="real">입력: 실제 세벌식 자판</option>
   <option value="auto">입력: 두벌식으로 치면 타자기가 알아서</option>
  </select>
  <select id="sPaper" title="종이">
   <option value="bs">종이: 타자 용지 (백상지)</option>
   <option value="gj">종이: 갱지 (누런 재생지)</option>
   <option value="gw">종이: 관공서 기안 용지</option>
   <option value="cb">종이: 먹지 사본 (카본 복사)</option>
  </select>
 </div>
 <div id="ctrls">
  <button class="btn" id="bPhone">⌨ 폰 키보드로 치기</button>
  <button class="btn" id="bLang"><span class="lamp"></span>한/영</button>
  <button class="btn" id="bInk">리본: 검정</button>
  <button class="btn" id="bBs">백스페이스: 지우기</button>
  <button class="btn on" id="bSnd"><span class="lamp"></span>소리</button>
  <button class="btn" id="bNew">새 종이</button>
  <button class="btn" id="bCopy">글 복사</button>
  <button class="btn" id="bPng">그림 저장</button>
 </div>
 <div id="hint"></div>
</div>
<textarea id="ta" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
<script>
(()=>{
const MAXX=64, MARGIN=8, MAXLINES=38, TOPL=3;
const U=12, LH=31, FS=22, W=1000, SY=330;
const $=id=>document.getElementById(id);
const stage=$('stage'),carriage=$('carriage'),paper=$('paper'),lever=$('lever'),ribbon=$('ribbon'),machine=$('machine');

/* ================= 기종 ================= */
const MODELS={
  k3:{set:3,kind:'manual',inputs:['real','auto'],pl:['세벌식 한글타자기','SPEED TYPE · 초성 · 중성 · 받침'],

let ac=null,noise=null,out=null,hum=null;
function audio(){
  if(!st.sound) return null;
  if(!ac){try{
    ac=new (window.AudioContext||window.webkitAudioContext)();const n=ac.sampleRate;
    noise=ac.createBuffer(1,n,n);const d=noise.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
    const cp=ac.createDynamicsCompressor();cp.threshold.value=-14;cp.ratio.value=4;cp.connect(ac.destination);
    out=ac.createGain();out.gain.value=.9;out.connect(cp);
    const ir=ac.createBuffer(2,n*.35|0,n);for(let c=0;c<2;c++){const b=ir.getChannelData(c);for(let i=0;i<b.length;i++)b[i]=(Math.random()*2-1)*Math.pow(1-i/b.length,3)}
    const cv=ac.createConvolver();cv.buffer=ir;const wet=ac.createGain();wet.gain.value=.16;out.connect(cv).connect(wet).connect(cp);
  }catch(e){return null}}
  if(ac.state==='suspended') ac.resume();
  return ac;
}
function burst(t,dur,freq,q,gain,type='bandpass'){
  const s=ac.createBufferSource();s.buffer=noise;s.playbackRate.value=.85+Math.random()*.3;
  const f=ac.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;
  const g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(gain,t+.0015);g.gain.exponentialRampToValueAtTime(.0005,t+dur);
  s.connect(f).connect(g).connect(out);s.start(t,Math.random()*.6,dur+.03);
}
function tone(t,freq,dur,gain,type='sine',end){
  const o=ac.createOscillator();o.type=type;o.frequency.setValueAtTime(freq,t);if(end)o.frequency.exponentialRampToValueAtTime(end,t+dur);
  const g=ac.createGain();g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.0005,t+dur);o.connect(g).connect(out);o.start(t);o.stop(t+dur+.03);
}

/* ================= 활자 그리기 ================= */
/* 칸(가로 24px × 세로 31px) 안에서 각 자모 활자가 찍히는 자리 [왼, 위, 오른, 아래] */
const BOX={
  3:{cho:[1,3.5,12.5,14.5],vv:[12,1,22.5,21],vh:[1,14.5,13.5,19.5],jong:[1.5,21,16,30]},
  4:{cho:[1.5,3.5,12,14],vv0:[12.5,1,22,28],vv1:[12.5,1,22,19],vh0:[1,16,14,23],vh1:[1,13.5,14,18.5],jong:[3,20.5,19,30]}
};
function geo(s){
  const bx=(MARGIN+s.x)*U, by=(TOPL+s.l)*LH;
  if(s.k==='full'||s.k==='lat') return {l:bx+s.dx,t:by+(LH-FS)/2+s.dy+1,w:s.w*U,fs:FS,sx:1,sy:1,full:1};
  const key=(s.k==='vv'||s.k==='vh')&&s.t===4?s.k+(s.b?1:0):s.k;
  const r=BOX[s.t]&&BOX[s.t][key]||BOX[3].cho, b=BB[s.ch]||[.2,.3,.7,.7];
  const F=FS, gw=(b[2]-b[0])*F, gh=(b[3]-b[1])*F, rw=r[2]-r[0], rh=r[3]-r[1];
  let sx=rw/gw, sy=rh/gh;
  if(s.k==='cho'||s.k==='jong'){const m=Math.min(sx,sy);sx=m;sy=m}
  if(s.k==='vv') sx=Math.min(sx,sy*.9);
  if(s.k==='vh') sy=Math.min(sy,sx*1.2);
  const ox=r[0]+(rw-gw*sx)/2, oy=r[1]+(rh-gh*sy)/2;
  return {l:bx+ox-b[0]*F*sx+s.dx*.5,t:by+oy-b[1]*F*sy+s.dy*.5,fs:F,sx,sy};
}
/* 종이에 찍힌 글자는 캔버스에 한 번만 그려요 (글자가 많아져도 느려지지 않게) */
const inkCv=$('ink'),DPR=Math.min(2,window.devicePixelRatio||1);let ink=null;
function setupInk(){inkCv.width=PW*DPR;inkCv.height=PH*DPR;inkCv.style.width=PW+'px';inkCv.style.height=PH+'px';ink=inkCv.getContext('2d');ink.setTransform(DPR,0,0,DPR,0,0)}
const INK={n:[[28,26,30],[163,34,27]],cb:[[51,48,110],[107,42,94]]};
const rgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
function paint(g,s,blurScale){
  const q=geo(s),col=(st.paper==='cb'?INK.cb:INK.n)[s.c?1:0],F=q.fs;
  g.save();g.globalAlpha=s.o;g.font=`${F}px DXType, Batang, serif`;
  let cx,cy;
  if(q.full){g.textAlign='center';g.translate(q.l+q.w/2,q.t);g.rotate(s.r*Math.PI/180);cx=0;cy=F*.45}
  else{g.textAlign='left';g.translate(q.l,q.t);g.rotate(s.r*Math.PI/180);g.scale(q.sx,q.sy);cx=F*.45;cy=F*.45}
  const ma=(s.ma||0)*Math.PI/180,dx=Math.cos(ma)*F*.5,dy=Math.sin(ma)*F*.5;
  const gr=g.createLinearGradient(cx-dx,cy-dy,cx+dx,cy+dy);
  gr.addColorStop(0,rgba(col,s.mp||.6));gr.addColorStop(Math.min(.95,.4+((s.ma||0)%30)/100),rgba(col,1));gr.addColorStop(1,rgba(col,1));
  g.fillStyle=gr;g.shadowColor=rgba(col,.55);g.shadowBlur=(st.paper==='cb'?2.2:(s.o<.82?1.1:.6))*blurScale;
  g.textBaseline='alphabetic';g.fillText(s.ch,0,F*.79);
  g.restore();
}
function drawStrike(s,hidden){if(hidden){pending.add(s);return}paint(ink,s,DPR)}
function redrawInk(){ink.clearRect(0,0,PW,PH);for(const s of st.strikes)if(!pending.has(s))paint(ink,s,DPR)}
function render(){redrawInk();moveTo(st.x,st.line,0)}

/* ================= 캐리지 / 헤드 이동 ================= */
const FIXTX=W/2-(MARGIN+MAXX/2+1)*U;

  const elec=M.kind==='elec';

  carriage.style.transform=`translateX(${tx}px)`;
  const g=$('guide');g.style.transition=dur&&elec?`left ${dur}ms cubic-bezier(.3,.7,.3,1)`:'none';
  g.style.left=(elec?FIXTX+(MARGIN+x+1)*U:W/2)+'px';

let keyEls=null,LIT=null;const _txt=new Map();

  setT('pend',M.kind==='elec'?'액정: '+(p||'—'):(useK3()?'글쇠마다 바로 찍힘':'치는 중: '+(p||'—')));

  setT('bInk','리본: '+(st.red?'빨강':'검정'));

  const sig=`${st.hangul}|${st.sound}|${shiftSticky}`;
  if(LIT!==sig&&keyEls){LIT=sig;$('bLang').classList.toggle('on',st.hangul);$('bSnd').classList.toggle('on',st.sound);
    keyEls.Lang.classList.toggle('lit',st.hangul);keyEls.ShiftLeft.classList.toggle('lit',shiftSticky);keyEls.ShiftRight.classList.toggle('lit',shiftSticky)}

let msgT;function msg(t){const m=$('msg');m.textContent=t;m.classList.add('show');clearTimeout(msgT);msgT=setTimeout(()=>m.classList.remove('show'),2200)}

/* 타격 연출 */
let ORDER=[],spA=0;const SP=[$('sp1'),$('sp2')];
function hit(key){
  if(M.kind==='elec'){$('wheel').style.transform=`rotate(${Math.random()*360|0}deg)`;return}
  ribbon.animate([{transform:'translateY(0)'},{transform:'translateY(-19px)',offset:.45},{transform:'translateY(0)'}],{duration:110});
  spA=(spA+3)%360;SP.forEach(e=>e.style.transform=`rotate(${spA}deg)`);
  let i=ORDER.indexOf(key);if(i<0){let h=0;for(const c of String(key))h=(h*31+c.charCodeAt(0))%997;i=h%ORDER.length}
  const a=(154-(i/(ORDER.length-1))*128)*Math.PI/180,c=Math.cos(a),s=Math.sin(a),P={x:500,y:SY+14};
  const L=$('abl'),Rr=$('abs'),t0=performance.now(),D=110;
  L.setAttribute('opacity',1);Rr.setAttribute('opacity',1);
  (function f(now){let t=Math.min(1,(now-t0)/D);const k=t<.45?t/.45:1-(t-.45)/.55;const r=104-k*100;
    const x1=P.x+c*r,y1=P.y+s*r,x2=P.x+c*(r+150),y2=P.y+s*(r+150);
    L.setAttribute('x1',x2);L.setAttribute('y1',y2);L.setAttribute('x2',x1);L.setAttribute('y2',y1);
    Rr.setAttribute('transform',`translate(${x1} ${y1}) rotate(${a*180/Math.PI-90})`);
    if(t<1)requestAnimationFrame(f);else{L.setAttribute('opacity',0);Rr.setAttribute('opacity',0)}})(t0);
}

/* ================= 연출 줄 (타닥타닥 순서대로) ================= */
const Q=[];let qRun=false;
function enq(ev){Q.push(ev);if(!qRun)runQ()}
function runQ(){
  const ev=Q.shift();if(!ev){qRun=false;return}qRun=true;
  if(ev.s){if(pending.delete(ev.s)&&st.strikes.includes(ev.s))paint(ink,ev.s,DPR);snd.strike(ev.dead);hit(ev.key)}
  if(ev.snd==='space'||ev.snd==='bs')snd.space();
  if(ev.snd==='ret'){lever.animate([{transform:'rotate(-16deg)'},{transform:'rotate(-38deg)',offset:.4},{transform:'rotate(-16deg)'}],{duration:380});snd.ret(ev.dist)}
  if(ev.bell)snd.bell();
  moveTo(ev.x,ev.line,ev.dur||70);
  setTimeout(runQ,ev.wait!=null?ev.wait:(Q.length?(M.kind==='elec'?55:46):0));
}

/* ================= 타자 동작 ================= */
const ENDMSG='줄 끝이에요 — Enter(레버)로 줄을 바꾸세요', PAPERMSG='종이가 끝났어요 — [새 종이]를 끼우세요';
function canPlace(w){
  if(st.line>=MAXLINES){lock(PAPERMSG);return false}
  if(st.x+w>MAXX){lock(ENDMSG);return false}
  return true;
}
function mk(o){
  const s=Object.assign({l:st.line,w:2,dx:+R(-.7,.7).toFixed(2),dy:+R(-.9,.9).toFixed(2),r:+R(-1.4,1.4).toFixed(2),o:+R(.74,.97).toFixed(2),ma:R(0,360)|0,mp:+R(.45,.9).toFixed(2)},o);
  if(st.red)s.c=1;st.strikes.push(s);drawStrike(s,true);return s;
}
function bellCheck(){if(!bellRung&&st.x>=MAXX-8){bellRung=true;return true}return false}
/* 활자 하나 찍기: dead=안 움직이는 글쇠, back=앞 칸에 찍기 */
function strikePiece(k,ch,{dead=false,back=false,b=false,key}={}){
  const px=back&&st.x>=2?st.x-2:st.x;
  const s=mk({x:px,ch,k,t:M.set,b});
  if(!dead)st.x+=2;
  enq({s,dead,key:key||ch,x:st.x,line:st.line,bell:!dead&&bellCheck()});
}
function strikeFull(ch,w,key){
  const s=mk({x:st.x,ch,k:w===1?'lat':'full',w,t:0});st.x+=w;
  enq({s,dead:false,key:key||ch,x:st.x,line:st.line,bell:bellCheck()});
}
/* 완성된 글자를 기종의 방식대로 찍기 */
function printSyl(ch){
  const d=decomp(ch);
  if(M.set===2){strikeFull(ch,2);return}
  if(!d){
    if(VV.includes(ch)||VH.includes(ch)||JUNGS[ch]){printVowels(ch,false,false);return}
    strikePiece('cho',ch,{dead:true});st.x+=2;enq({x:st.x,line:st.line,snd:'space',bell:bellCheck()});return;
  }
  strikePiece('cho',d.cho,{dead:true});
  const b=!!d.jong;
  if(M.set===3){printVowels(d.jung,false,false);if(b)strikePiece('jong',d.jong,{dead:true,back:true})}
  else{printVowels(d.jung,b,b);if(b)strikePiece('jong',d.jong,{})}
}
function printVowels(v,b,lastDead){
  const parts=JUNGS[v]||[v];
  parts.forEach((p,i)=>{const last=i===parts.length-1;strikePiece(VV.includes(p)?'vv':'vh',p,{dead:last?lastDead:true,b})});
}

/* --- 두벌식 조합 (자동 입력) --- */
function commit(){if(comp){const c=syl(comp);comp=null;hist=[];printSyl(c);save()}status()}
function startSyl(j){
  if(!canPlace(2))return;
  const v=JUNG.includes(j);comp={cho:v?'':j,jung:v?j:'',jong:''};hist=[];
}
function jamo(j){
  if(M.kind==='elec')snd.soft();else snd.soft();
  if(!comp){startSyl(j);status();return}
  const s=comp,v=JUNG.includes(j),push=()=>hist.push({...s});
  if(!v){
    if(!s.jung){commit();startSyl(j)}
    else if(!s.jong){ if(s.cho&&canJong(j)){push();s.jong=j} else {commit();startSyl(j)} }
    else { const c=JONGC[s.jong+j]; if(c){push();s.jong=c} else {commit();startSyl(j)} }
  }else{
    if(!s.jung){push();s.jung=j}
    else if(!s.jong){ const c=JUNGC[s.jung+j]; if(c){push();s.jung=c} else {commit();startSyl(j)} }
    else{
      if(st.x+4>MAXX){lock(ENDMSG);return}
      let mv;const sp=JONGS[s.jong];if(sp){s.jong=sp[0];mv=sp[1]}else{mv=s.jong;s.jong=''}
      commit();comp={cho:mv,jung:j,jong:''};hist=[{cho:mv,jung:'',jong:''}];
    }
  }
  status();
}
/* --- 실제 세벌식 글쇠: 누르는 즉시 그 활자가 찍힘 --- */
function key3(spec,code){
  if(spec[1]!==':'||spec.length<3){typeChar(spec,code);return}
  const t=spec[0],j=spec.slice(2);
  if(st.line>=MAXLINES){lock(PAPERMSG);return}
  if(t==='c'){
    if(st.x+2>MAXX){lock(ENDMSG);return}
    const cell=st.strikes.filter(s=>s.l===st.line&&s.x===st.x);
    const prev=cell.length===1&&cell[0].k==='cho'?cell[0]:null;
    if(prev&&prev.ch===j&&DBL[j]){removeStrike(prev);strikePiece('cho',DBL[j],{dead:true,key:code});save();return}
    strikePiece('cho',j,{dead:true,key:code});
  }
  else if(t==='v'){if(st.x+2>MAXX){lock(ENDMSG);return}printVowels(j,false,false)}
  else if(t==='d'){strikePiece('vh',j,{dead:true,key:code})}
  else if(t==='j'){strikePiece('jong',j,{dead:true,back:true,key:code})}
  save();status();
}
function typeChar(ch,code){
  commit();
  if(!canPlace(1))return;
  strikeFull(ch,1,code);save();
}
function space(){
  commit();
  if(st.line>=MAXLINES){lock(PAPERMSG);return}
  if(st.x+1>MAXX){lock(ENDMSG);return}
  st.x+=1;enq({x:st.x,line:st.line,snd:'space',bell:bellCheck()});save();
}
function tab(){commit();const n=Math.min(MAXX,(Math.floor(st.x/8)+1)*8);if(n===st.x){lock();return}st.x=n;enq({x:st.x,line:st.line,snd:'space',dur:140,bell:bellCheck()});save()}
function ret(){
  commit();
  if(st.line>=MAXLINES){lock(PAPERMSG);return}
  const d=st.x;st.x=0;st.line++;bellRung=false;
  enq({x:0,line:st.line,snd:'ret',dist:d,dur:(M.kind==='elec'?100:200)+d*6,wait:120});save();
  if(st.line>=MAXLINES)setTimeout(()=>msg(PAPERMSG),500);
}
function back(){
  if(comp){if(hist.length)comp=hist.pop();else comp=null;snd.soft();status();return}
  const here=st.strikes.filter(s=>s.l===st.line&&s.x===st.x);
  if(here.length&&!st.real){here.forEach(removeStrike);snd.space();save();status();return}
  if(st.x===0){lock();return}
  const prev=st.strikes.filter(s=>s.l===st.line&&s.x<st.x).sort((a,b)=>b.x-a.x)[0];
  const w=prev&&prev.x+prev.w===st.x?prev.w:1;
  st.x-=w;
  if(!st.real)st.strikes.filter(s=>s.l===st.line&&s.x===st.x).forEach(removeStrike);
  if(st.x<MAXX-8)bellRung=false;
  enq({x:st.x,line:st.line,snd:'bs'});save();
}
let rdT=0;function removeStrike(s){const i=st.strikes.indexOf(s);if(i>=0)st.strikes.splice(i,1);pending.delete(s);if(!rdT)rdT=requestAnimationFrame(()=>{rdT=0;redrawInk()})}
function newPaper(){
  comp=null;hist=[];Q.length=0;pending.clear();st.strikes=[];st.line=0;st.x=0;bellRung=false;render();snd.paper();
  paper.style.transition='none';paper.style.transform=`translateY(${SY+40}px)`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>moveTo(0,0,700)));save();
}
function toggleLang(){commit();st.hangul=!st.hangul;snd.lf();status();hintText();save()}

/* ================= 입력 처리 ================= */
function press(code,shift,caps){
  if(code==='Lang'){toggleLang();return}
  if(code==='Backspace'){back();return}
  if(code==='Enter'){ret();return}
  if(code==='Space'){space();return}
  if(code==='Tab'){tab();return}
  if(useK3()&&K3[code]){key3(K3[code][shift?1:0],code);return}
  if(/^Key[A-Z]$/.test(code)){
    if(st.hangul){jamo(shift&&KOS[code]?KOS[code]:KO[code]);return}
    const c=code.slice(3);typeChar((shift!==!!caps)?c:c.toLowerCase(),code);return;
  }
  if(SYM[code]){typeChar(SYM[code][shift?1:0],code);return}
}
addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey)return;
  if(e.target&&(e.target.id==='ta'||e.target.tagName==='SELECT'))return;
  const code=e.code;
  if(code==='Lang1'||e.key==='HangulMode'||code==='AltRight'||(code==='Space'&&e.shiftKey)){e.preventDefault();if(!e.repeat)toggleLang();flash('Lang');return}
  if(code.startsWith('Shift')){shiftHeld=true;relabel();flash(code);return}
  const ok=code==='Backspace'||code==='Enter'||code==='Space'||code==='Tab'||/^Key[A-Z]$/.test(code)||SYM[code];
  if(!ok)return;
  e.preventDefault();
  if(e.repeat&&code!=='Backspace')return;   // 진짜 타자기엔 자동 반복이 없어요
  flash(code);
  press(code,e.shiftKey,e.getModifierState&&e.getModifierState('CapsLock'));
});
addEventListener('keyup',e=>{if(e.code.startsWith('Shift')){shiftHeld=false;relabel()}});

/* ================= 자판 ================= */
const ROWS=[

const lab=spec=>spec&&spec[1]===':'&&spec.length>2?[spec.slice(2),'c-'+spec[0]]:[spec||'',''];
let LAB='';
function relabel(){
  const sh=shiftHeld||shiftSticky,k3=useK3(),sig=`${sh}|${k3}|${st.hangul}|${st.model}`;if(sig===LAB)return;LAB=sig;
  for(const c in keyEls){const k=keyEls[c];if(NAMES[c]||c==='Space')continue;
    const m=k.querySelector('.m'),s=k.querySelector('.sh'),en=k.querySelector('.en');
    if(k3&&K3[c]){
      const [a,ac_]=lab(K3[c][sh?1:0]),[b,bc]=lab(K3[c][1]);
      m.textContent=a;m.className='m '+ac_;s.textContent=sh?'':b;s.className='sh '+bc;en.textContent=/^Key/.test(c)?c.slice(3):'';
      continue;
    }
    m.className='m';s.className='sh';
    if(/^Key/.test(c)){const L=c.slice(3);
      if(st.hangul){m.textContent=(sh&&KOS[c])?KOS[c]:KO[c];s.textContent=(!sh&&KOS[c])?KOS[c]:'';en.textContent=L}
      else{m.textContent=sh?L:L.toLowerCase();s.textContent='';en.textContent=KO[c]}
    }else{m.textContent=SYM[c][sh?1:0];s.textContent=sh?'':SYM[c][1];en.textContent=''}
  }
}
function flash(code){const k=keyEls[code];if(!k)return;k.classList.add('down');setTimeout(()=>k.classList.remove('down'),110)}

/* ================= 폰 키보드 ================= */
const ta=$('ta'),SENT='\u00a0\u00a0';let taPrev=SENT;ta.value=SENT;
function typeAny(ch){
  if(ch==='\n'){ret();return}
  if(ch===' '||ch==='\u00a0'){space();return}
  const c=ch.charCodeAt(0);
  if((c>=0xAC00&&c<=0xD7A3)||(c>=0x3131&&c<=0x318E)){commit();if(!canPlace(2))return;printSyl(ch);save();return}
  typeChar(ch);
}
function flushTA(){
  const v=ta.value;let i=0;while(i<v.length&&i<taPrev.length&&v[i]===taPrev[i])i++;
  for(let n=taPrev.length-i;n>0;n--)back();
  for(const ch of v.slice(i))typeAny(ch);
  taPrev=v;
  if(v.length<SENT.length||v.length>120){ta.value=SENT;taPrev=SENT}
}
ta.addEventListener('input',e=>{if(e.isComposing)return;flushTA()});
ta.addEventListener('compositionend',()=>setTimeout(flushTA,0));
$('bPhone').onclick=()=>{ta.value=SENT;taPrev=SENT;ta.focus();msg('휴대폰 키보드로 치세요 — 글자가 완성되면 찍혀요')};

/* ================= 글 / 그림 ================= */
function cellText(arr){
  const f=arr.filter(s=>s.k==='full'||s.k==='lat');if(f.length)return f[f.length-1].ch;
  let cho='',jung='',jong='';
  arr.forEach(s=>{if(s.k==='cho')cho=s.ch;else if(s.k==='jong')jong=s.ch;else{jung=jung?(JUNGC[jung+s.ch]||s.ch):s.ch}});
  if(cho&&jung)return syl({cho,jung,jong:canJong(jong)?jong:''});
  return cho+jung+jong;
}
function lineText(l){
  const cells=new Map();st.strikes.filter(s=>s.l===l).forEach(s=>{if(!cells.has(s.x))cells.set(s.x,[]);cells.get(s.x).push(s)});
  let str='',x=0;[...cells.keys()].sort((a,b)=>a-b).forEach(cx=>{if(cx<x)return;const arr=cells.get(cx);str+=' '.repeat(cx-x)+cellText(arr);x=cx+Math.max(...arr.map(s=>s.w))});
  return str.replace(/\s+$/,'');
}
function toText(){const n=Math.max(st.line+1,...st.strikes.map(s=>s.l+1),1);const o=[];for(let l=0;l<n;l++)o.push(lineText(l));return o.join('\n').replace(/\n+$/,'')}

/* ================= 버튼 ================= */
$('bLang').onclick=toggleLang;
$('bInk').onclick=()=>{commit();st.red=!st.red;snd.lf();status();save()};
$('bBs').onclick=()=>{st.real=!st.real;status();save()};
$('bSnd').onclick=()=>{st.sound=!st.sound;if(!st.sound)snd.humOff();else if(M.kind==='elec')snd.humOn();status();save()};
let newArm=0;
$('bNew').onclick=()=>{if(st.strikes.length&&Date.now()-newArm>2500){newArm=Date.now();msg('한 번 더 누르면 새 종이로 바꿔요');return}newPaper()};
lever.addEventListener('pointerdown',e=>{e.preventDefault();ret()});
document.querySelectorAll('.btn').forEach(b=>{b.addEventListener('mousedown',e=>e.preventDefault());b.addEventListener('click',()=>b.blur())});
$('bCopy').onclick=async()=>{commit();const t=toText();
  try{await navigator.clipboard.writeText(t);msg('글을 복사했어요')}
  catch(e){const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();try{document.execCommand('copy');msg('글을 복사했어요')}catch(_){msg('복사하지 못했어요')}x.remove()}};
$('bPng').onclick=async()=>{
  commit();
  try{await document.fonts.load(`${FS}px DXType`,'가ㄱA')}catch(e){}
  const k=3,lastL=Math.max(st.line,...st.strikes.map(s=>s.l),0),ph=st.paper==='gw'?PH:Math.min(PH,(TOPL+lastL+4)*LH);
  const cv=document.createElement('canvas');cv.width=PW*k;cv.height=ph*k;const g=cv.getContext('2d');g.scale(k,k);
  g.fillStyle=getComputedStyle(paper).backgroundColor;g.fillRect(0,0,PW,ph);
  for(let i=0;i<PW*ph/90;i++){g.fillStyle=`rgba(90,70,40,${Math.random()*.06})`;g.fillRect(Math.random()*PW,Math.random()*ph,R(.5,2),R(.5,2))}
  if(st.paper==='gj')for(let i=0;i<PW*ph/2500;i++){g.fillStyle=`rgba(40,30,15,${R(.2,.5)})`;g.fillRect(Math.random()*PW,Math.random()*ph,R(.6,2.2),R(.6,1.6))}
  if(st.paper==='gw'){g.strokeStyle='rgba(162,65,44,.5)';g.fillStyle='#a2412c';g.lineWidth=1;const y0=TOPL*LH,x0=MARGIN*U-14,x1=PW-MARGIN*U+14;
    g.font=`26px DXType`;g.textAlign='center';g.fillText('기 안 용 지',PW/2,y0-LH*1.2);g.textAlign='left';g.font='13px DXType';
    ['분류기호','시행일자','수　　신','참　　조','기　　안','제　　목'].forEach((l,i)=>g.fillText(l,MARGIN*U,y0+i*LH+20));
    for(let i=0;i<=MAXLINES;i++){g.beginPath();g.moveTo(x0,y0+i*LH-1);g.lineTo(x1,y0+i*LH-1);g.stroke()}
    [[x0,LH*MAXLINES],[x1,LH*MAXLINES],[(MARGIN+10)*U-6,LH*6]].forEach(([x,h])=>{g.beginPath();g.moveTo(x,y0-4);g.lineTo(x,y0+h);g.stroke()})}
  for(const s of st.strikes)paint(g,s,k);
  const a=document.createElement('a');a.download='typekr.png';a.href=cv.toDataURL('image/png');a.click();msg('그림으로 저장했어요');
};

/* ================= 기종 / 입력 / 종이 선택 ================= */
function hintText(){
  let h=M.hint;
  if(M.set===3&&st.input==='auto')h='공병우식 타자기를 두벌식으로 칩니다 — 한 글자가 완성되면 초성 · 모음 · 받침 활자가 세벌식 순서대로 찍혀요.';
  if(!st.hangul)h='영문 모드예요. 한/영 키나 Shift+Space로 한글로 바꾸세요.';
  $('hint').innerHTML=h+'<br><kbd>Shift</kbd>+<kbd>Space</kbd> 또는 <kbd>한/영</kbd> 한영 전환 · <kbd>Enter</kbd>나 왼쪽 레버로 줄바꿈 · 줄 끝 8칸 전에 종이 울려요';
}
function applyModel(){
  M=MODELS[st.model];machine.dataset.m=st.model;
  if(!M.inputs.includes(st.input))st.input=M.inputs[0];
  const si=$('sInput');si.style.display=M.inputs.length>1?'':'none';si.value=st.input;
  $('sModel').value=st.model;$('sPaper').value=st.paper;
  $('pl1').textContent=M.pl[0];$('pl2').textContent=M.pl[1];
  if(M.kind==='elec'&&ac&&st.sound)snd.humOn();else snd.humOff();
  hintText();moveTo(st.x,st.line,0);
}
$('sModel').onchange=e=>{commit();st.model=e.target.value;st.input=MODELS[st.model].inputs[0];applyModel();save();e.target.blur();msg('기종을 바꿨어요')};
$('sInput').onchange=e=>{commit();st.input=e.target.value;applyModel();save();e.target.blur()};
$('sPaper').onchange=e=>{st.paper=e.target.value;paperLook();redrawInk();save();e.target.blur();snd.paper()};

/* ================= 시작 ================= */
addEventListener('resize',fit);
build();setupInk();fit();paperLook();applyModel();
document.fonts&&document.fonts.load('22px DXType','가ㄱA').finally(render);
render();relabel();status();
addEventListener('pointerdown',()=>{if(M.kind==='elec'&&st.sound){audio();snd.humOn()}},{once:true});
if(!st.strikes.length)setTimeout(()=>msg('아무 키나 눌러 타자를 시작하세요'),600);
})();
</script>
