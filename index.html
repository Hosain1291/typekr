<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>typekr — 한글 타자기</title>
<style>
@font-face{font-family:'DXType';src:url(fonts/DXTypeB.woff2) format('woff2'),url(fonts/DXTypeB.woff) format('woff');font-display:block}
:root{--ink:#1c1a1e;--red:#b3261e;
  --body:#4a5a47;--bodyD:#2e392d;
  --crinkle:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1.5px),radial-gradient(rgba(0,0,0,.22) 1px,transparent 1.6px);
  --chrome:linear-gradient(180deg,#fdfdfd 0%,#cfd2d4 18%,#7d8184 45%,#e9ecee 62%,#a3a7aa 85%,#5f6366 100%)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{min-height:100vh;color:#eee;font-family:'DXType','Batang',serif;overflow-x:hidden;user-select:none;-webkit-user-select:none;
  background:#3b2a1d;background-image:repeating-linear-gradient(92deg,rgba(0,0,0,.08) 0 2px,transparent 2px 9px),repeating-linear-gradient(88deg,rgba(255,220,180,.04) 0 1px,transparent 1px 23px),radial-gradient(ellipse at 50% 30%,#7a5636 0%,#3b2a1d 75%)}
#scaler{position:relative;margin:0 auto;padding-top:6px}
#machine{position:absolute;left:0;top:0;width:1000px;height:956px;transform-origin:0 0}

/* ---------- 캐리지 ---------- */
#carriage{position:absolute;left:0;top:0;will-change:transform;z-index:2}
#table{position:absolute;top:150px;height:200px;clip-path:polygon(9% 0,91% 0,100% 100%,0 100%);
  background:linear-gradient(180deg,#5c615f,#2b2f2e 70%,#1d201f);box-shadow:inset 0 2px 0 #fff3}
#table::after{content:'';position:absolute;inset:18px 16%;background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(0,0,0,.35) 46px 50px)}
#clip{position:absolute;left:0;top:0;overflow:hidden}
#paper{position:absolute;left:0;top:0;background:#f5f0e3;
  background-image:radial-gradient(circle at 20% 30%,rgba(0,0,0,.025),transparent 40%),radial-gradient(circle at 80% 70%,rgba(120,90,40,.05),transparent 50%),linear-gradient(90deg,rgba(0,0,0,.05),transparent 3%,transparent 97%,rgba(0,0,0,.05));
  box-shadow:0 0 14px rgba(0,0,0,.5);will-change:transform}
.s{position:absolute;text-align:center;color:var(--ink);font-family:'DXType','Batang',serif;white-space:pre;pointer-events:none;text-shadow:0 0 .6px rgba(20,18,22,.7)}
.s.red{color:var(--red);text-shadow:0 0 .6px rgba(150,30,20,.6)}
#platen{position:absolute;height:62px;border-radius:30px/31px;
  background:linear-gradient(180deg,#000 0%,#2c2c2c 16%,#4a4a4a 26%,#1e1e1e 50%,#0a0a0a 78%,#000 100%);box-shadow:0 8px 12px rgba(0,0,0,.55)}
.knob{position:absolute;width:52px;height:84px;border-radius:14px;background:linear-gradient(90deg,#0c0c0c,#555 38%,#222 62%,#000);box-shadow:0 6px 10px #0008}
.knob::after{content:'';position:absolute;inset:9px 7px;border-radius:9px;background:repeating-linear-gradient(0deg,#2e2e2e 0 3px,#0e0e0e 3px 6px)}
.knob::before{content:'';position:absolute;top:30px;width:16px;height:24px;background:var(--chrome);border-radius:3px}
.knob.l::before{right:-14px}.knob.r::before{left:-14px}
#bail{position:absolute;height:7px;border-radius:4px;background:var(--chrome);box-shadow:0 2px 3px #0009}
#bail i{position:absolute;top:-4px;width:26px;height:15px;border-radius:7px;background:linear-gradient(#333,#0a0a0a)}
#scale{position:absolute;height:20px;border-radius:3px;background:var(--chrome);box-shadow:0 2px 3px #0008;overflow:hidden}
#scale span{position:absolute;bottom:0;width:1px;background:#222}
#scale b{position:absolute;top:0;font:9px/10px Arial,sans-serif;color:#111;transform:translateX(-50%)}
#rail{position:absolute;height:14px;border-radius:3px;background:linear-gradient(#3b3b3b,#0c0c0c)}
#lever{position:absolute;width:150px;height:15px;border-radius:8px;cursor:pointer;background:var(--chrome);box-shadow:0 4px 6px rgba(0,0,0,.6);transform-origin:right center;transform:rotate(-16deg)}
#lever::before{content:'';position:absolute;left:-18px;top:-9px;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#999 55%,#444)}
#lever.pull{animation:pull .38s}
@keyframes pull{40%{transform:rotate(-38deg)}}
#rel{position:absolute;width:16px;height:70px;border-radius:8px;background:var(--chrome);box-shadow:0 3px 5px #0008;transform:rotate(14deg)}
#stage.shake #carriage{animation:shake .18s}
@keyframes shake{25%{margin-left:-3px}75%{margin-left:3px}}

/* ---------- 몸체 ---------- */
.paint{background-color:var(--body);background-image:var(--crinkle),linear-gradient(180deg,#5d6f59,#3a4838);background-size:4px 4px,5px 5px,100% 100%}
#hood{position:absolute;left:40px;top:416px;width:920px;height:190px;border-radius:170px 170px 0 0/110px 110px 0 0;z-index:1;box-shadow:inset 0 3px 0 rgba(255,255,255,.18),inset 0 -20px 30px rgba(0,0,0,.25)}
#seg{position:absolute;left:200px;top:0;width:520px;height:160px;border-radius:0 0 260px 260px/0 0 160px 160px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 0%,#252525 0%,#060606 70%);box-shadow:inset 0 0 0 4px #1a1a1a,0 2px 0 rgba(255,255,255,.15)}
.spool{position:absolute;width:132px;height:132px;border-radius:50%;z-index:4;
  background:radial-gradient(circle,#ddd 0 9px,#555 10px 13px,#151515 14px 40px,#2a2a2a 41px 44px,#141414 45px 54px,transparent 55px),var(--chrome);
  box-shadow:0 6px 10px #000a,inset 0 0 0 3px #888}
.spool::after{content:'';position:absolute;left:62px;top:20px;width:8px;height:22px;background:#bbb;border-radius:2px;box-shadow:0 70px 0 #bbb}
.spool.turn{animation:spin .5s linear}
@keyframes spin{to{transform:rotate(30deg)}}
#rib{position:absolute;left:0;top:0;z-index:3;pointer-events:none}
#guide{position:absolute;left:500px;width:0;height:0;z-index:6;pointer-events:none}
#guide .ear{position:absolute;top:14px;width:13px;height:30px;background:linear-gradient(90deg,rgba(180,190,190,.55),rgba(255,255,255,.85) 50%,rgba(150,160,160,.55));border-radius:3px 3px 6px 6px;box-shadow:0 0 0 1px #6669}
#guide .ear.l{left:-36px}#guide .ear.r{left:23px}
#guide .mark{position:absolute;left:-1px;top:16px;width:2px;height:9px;background:#e73}
#ribbon{position:absolute;left:-21px;width:42px;height:15px;top:22px;background:linear-gradient(#111 0 50%,#9e1a14 50% 100%);border-radius:2px;transition:transform 55ms}
#ribbon.hit{transform:translateY(-19px)}
#abar{position:absolute;left:0;top:0;z-index:5;pointer-events:none}
#front{position:absolute;left:18px;top:566px;width:964px;height:372px;border-radius:26px 26px 70px 70px/26px 26px 50px 50px;z-index:1;
  box-shadow:0 26px 40px rgba(0,0,0,.65),inset 0 3px 0 rgba(255,255,255,.15),inset 0 -14px 24px rgba(0,0,0,.35)}
#plate{position:absolute;left:50%;top:-24px;transform:translateX(-50%);padding:6px 26px 5px;border-radius:7px;z-index:3;text-align:center;line-height:1.05;
  background:linear-gradient(#f0d995,#a8833a 52%,#e0c070);color:#3a2a0c;box-shadow:inset 0 1px 0 #fff8,0 3px 5px #0009}
#plate b{display:block;font-size:24px;letter-spacing:4px}#plate small{font-size:10px;letter-spacing:4px}
.foot{position:absolute;bottom:-14px;width:90px;height:22px;border-radius:0 0 14px 14px;background:#151515}
#kb{position:absolute;left:46px;top:46px;width:872px;height:298px;border-radius:18px;z-index:0;
  background:linear-gradient(#0d100d,#1f261e 40%,#262e25);box-shadow:inset 0 10px 20px #000c}
.row{position:absolute;display:flex;gap:9px}
.k{position:relative;width:54px;height:54px;border-radius:50%;cursor:pointer;flex:none;top:0;
  background:radial-gradient(circle at 50% 38%,#303030,#0a0a0a 68%);
  box-shadow:0 0 0 4px #d6d9db,0 0 0 5px #5a5d5f,0 0 0 6px #b5b9bb,0 8px 6px 2px #000b;transition:top 45ms;
  display:flex;align-items:center;justify-content:center;color:#f4f0e2}
.k::before{content:'';position:absolute;inset:5px;border-radius:50%;background:radial-gradient(ellipse at 50% 22%,rgba(255,255,255,.22),transparent 55%)}
.k::after{content:'';position:absolute;left:50%;bottom:50%;width:7px;margin-left:-3.5px;height:80px;z-index:-1;background:linear-gradient(90deg,#050505,#4a4a4a 50%,#050505)}
.k .m{font-size:21px;line-height:1}
.k .sh{position:absolute;top:8px;left:12px;font-size:11px;color:#bbb}
.k .en{position:absolute;bottom:7px;right:12px;font-size:10px;color:#9a9}
.k.down{top:6px}
.k.wide{border-radius:27px;width:92px}.k.wide .m{font-size:14px}
.k.lit{box-shadow:0 0 0 4px #f6a64a,0 0 0 5px #5a5d5f,0 0 0 6px #b5b9bb,0 8px 6px 2px #000b}
#space{position:absolute;left:250px;top:262px;width:400px;height:22px;border-radius:11px;cursor:pointer;background:var(--chrome);box-shadow:0 6px 6px #000b;transition:top 45ms}
#space.down{top:267px}
#space::before,#space::after{content:'';position:absolute;bottom:14px;width:12px;height:40px;z-index:-1;background:linear-gradient(90deg,#222,#777,#222)}
#space::before{left:40px}#space::after{right:40px}

/* ---------- 아래 조작판 ---------- */
#desk{max-width:1000px;margin:0 auto;padding:4px 10px 20px;text-align:center}
#status{display:inline-block;font-size:14px;color:#3a2a14;background:#efe6cf;padding:5px 14px;border-radius:3px;box-shadow:0 2px 4px #0007;transform:rotate(-.6deg);margin-bottom:10px}
#ctrls{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.btn{font:inherit;font-size:13px;color:#eee;background:linear-gradient(#2a2a2a,#111);border:1px solid #000;border-radius:6px;padding:6px 10px;cursor:pointer;box-shadow:0 2px 0 #000,inset 0 1px 0 #fff2}
.btn:active{transform:translateY(2px);box-shadow:inset 0 1px 0 #fff2}
.btn .lamp{display:inline-block;width:8px;height:8px;border-radius:50%;background:#431;margin-right:5px;vertical-align:1px}
.btn.on .lamp{background:#f93;box-shadow:0 0 8px #f93}
#bPhone{background:linear-gradient(#7a5a1a,#4a3408)}
#msg{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#000d;color:#fc6;padding:7px 16px;border-radius:6px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;z-index:99}
#msg.show{opacity:1}
#hint{color:#d9c7a6;font-size:13px;margin-top:12px;line-height:1.7}
#hint kbd{font-family:inherit;background:#111;border:1px solid #000;border-radius:4px;padding:0 5px;color:#eee}
#ta{position:fixed;left:0;bottom:0;width:1px;height:1px;opacity:0;font-size:16px;border:0;padding:0;resize:none}
</style>
</head>
<body>
<div id="msg"></div>
<div id="scaler">
 <div id="machine">
  <div id="stage">
   <div id="carriage">
    <div id="table"></div>
    <div id="clip"><div id="paper"></div></div>
    <div id="platen"></div>
    <div class="knob l" id="kl"></div><div class="knob r" id="kr"></div>
    <div id="bail"><i style="left:24%"></i><i style="right:24%"></i></div>
    <div id="scale"></div>
    <div id="rail"></div>
    <div id="lever" title="줄바꿈 레버 (Enter)"></div>
    <div id="rel"></div>
   </div>
  </div>
  <div id="hood" class="paint"><div id="seg"><svg id="fan" width="520" height="160"></svg></div></div>
  <div class="spool" id="sp1" style="left:150px;top:430px"></div>
  <div class="spool" id="sp2" style="left:718px;top:430px"></div>
  <svg id="rib" width="1000" height="600"></svg>
  <svg id="abar" width="1000" height="700"><line id="abl" x1="0" y1="0" x2="0" y2="0" stroke="#c9c9c9" stroke-width="5" stroke-linecap="round" opacity="0"/><rect id="abs" width="12" height="16" x="-6" y="-8" fill="#2a2a2a" opacity="0"/></svg>
  <div id="guide"><div class="ear l"></div><div class="ear r"></div><div id="ribbon"></div><div class="mark"></div></div>
  <div id="front" class="paint">
   <div id="plate"><b>한글타자기</b><small>TYPEKR · 두벌식 · 1966</small></div>
   <div id="kb"></div>
   <div class="foot" style="left:60px"></div><div class="foot" style="right:60px"></div>
  </div>
 </div>
</div>
<div id="desk">
 <div id="status"></div>
 <div id="ctrls">
  <button class="btn" id="bPhone">⌨ 폰 키보드로 치기</button>
  <button class="btn" id="bLang"><span class="lamp"></span>한/영</button>
  <button class="btn" id="bInk">리본: 검정</button>
  <button class="btn" id="bBs">백스페이스: 지우기</button>
  <button class="btn on" id="bSnd"><span class="lamp"></span>소리</button>
  <button class="btn" id="bNew">새 종이</button>
  <button class="btn" id="bCopy">글 복사</button>
  <button class="btn" id="bPng">그림 저장</button>
 </div>
 <div id="hint">키보드로 바로 치거나 타자기 자판을 누르세요 · <kbd>Shift</kbd>+<kbd>Space</kbd> 또는 <kbd>한/영</kbd> 한영 전환 · <kbd>Enter</kbd> 또는 왼쪽 레버로 줄바꿈 · 줄 끝 8칸 전에 종이 울려요</div>
</div>
<textarea id="ta" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
<script>
(()=>{
const MAXX=64, MARGIN=8, MAXLINES=36, TOPL=3;
const U=12, LH=31, FS=22, W=1000, SY=330;
const $=id=>document.getElementById(id);
const stage=$('stage'),carriage=$('carriage'),clip=$('clip'),paper=$('paper'),lever=$('lever'),ribbon=$('ribbon');
let st={strikes:[],line:0,x:0,hangul:true,red:false,real:false,sound:true};
let comp=null, hist=[], cur=null, bellRung=false, shiftSticky=false, lastCode='';
const els=new Map();
try{const v=JSON.parse(localStorage.getItem('typekr-v1')); if(v&&Array.isArray(v.strikes)) Object.assign(st,v);}catch(e){}
let saveT; function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem('typekr-v1',JSON.stringify(st))}catch(e){}},300)}
/* ================= 한글 조합 (두벌식) ================= */
const CHO="ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
const JUNG="ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ";
const JONG=" ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ";
const JUNGC={'ㅗㅏ':'ㅘ','ㅗㅐ':'ㅙ','ㅗㅣ':'ㅚ','ㅜㅓ':'ㅝ','ㅜㅔ':'ㅞ','ㅜㅣ':'ㅟ','ㅡㅣ':'ㅢ'};
const JONGC={'ㄱㅅ':'ㄳ','ㄴㅈ':'ㄵ','ㄴㅎ':'ㄶ','ㄹㄱ':'ㄺ','ㄹㅁ':'ㄻ','ㄹㅂ':'ㄼ','ㄹㅅ':'ㄽ','ㄹㅌ':'ㄾ','ㄹㅍ':'ㄿ','ㄹㅎ':'ㅀ','ㅂㅅ':'ㅄ'};
const JONGS={};for(const k in JONGC)JONGS[JONGC[k]]=[k[0],k[1]];
const canJong=c=>JONG.indexOf(c)>0;
function syl(s){
  if(s.cho&&s.jung) return String.fromCharCode(0xAC00+(CHO.indexOf(s.cho)*21+JUNG.indexOf(s.jung))*28+(s.jong?JONG.indexOf(s.jong):0));
  return s.cho||s.jung;
}
const KO={KeyQ:'ㅂ',KeyW:'ㅈ',KeyE:'ㄷ',KeyR:'ㄱ',KeyT:'ㅅ',KeyY:'ㅛ',KeyU:'ㅕ',KeyI:'ㅑ',KeyO:'ㅐ',KeyP:'ㅔ',
  KeyA:'ㅁ',KeyS:'ㄴ',KeyD:'ㅇ',KeyF:'ㄹ',KeyG:'ㅎ',KeyH:'ㅗ',KeyJ:'ㅓ',KeyK:'ㅏ',KeyL:'ㅣ',
  KeyZ:'ㅋ',KeyX:'ㅌ',KeyC:'ㅊ',KeyV:'ㅍ',KeyB:'ㅠ',KeyN:'ㅜ',KeyM:'ㅡ'};
const KOS={KeyQ:'ㅃ',KeyW:'ㅉ',KeyE:'ㄸ',KeyR:'ㄲ',KeyT:'ㅆ',KeyO:'ㅒ',KeyP:'ㅖ'};
const SYM={Backquote:'`~',Digit1:'1!',Digit2:'2@',Digit3:'3#',Digit4:'4$',Digit5:'5%',Digit6:'6^',Digit7:'7&',Digit8:'8*',Digit9:'9(',Digit0:'0)',
  Minus:'-_',Equal:'=+',BracketLeft:'[{',BracketRight:']}',Backslash:'\\|',Semicolon:';:',Quote:"'\"",Comma:',<',Period:'.>',Slash:'/?'};

/* ================= 소리 (Web Audio 합성) ================= */
let ac=null,noise=null;
function audio(){
  if(!st.sound) return null;
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();const n=ac.sampleRate;noise=ac.createBuffer(1,n,n);const d=noise.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;}catch(e){return null}}
  if(ac.state==='suspended') ac.resume();
  return ac;
}
function burst(t,dur,freq,q,gain,type='bandpass'){
  const s=ac.createBufferSource();s.buffer=noise;s.playbackRate.value=.8+Math.random()*.4;
  const f=ac.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;
  const g=ac.createGain();g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f).connect(g).connect(ac.destination);s.start(t,Math.random()*.5,dur+.02);
}
function thump(t,freq,dur,gain){
  const o=ac.createOscillator();o.type='triangle';o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(freq*.5,t+dur);
  const g=ac.createGain();g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur+.02);
}
const snd={
  key(){if(!audio())return;const t=ac.currentTime;burst(t,.035,2200+Math.random()*900,1.2,.9);burst(t+.012,.05,900,2,.5);thump(t,150+Math.random()*30,.06,.6);burst(t+.07,.03,4000,3,.18)},
  space(){if(!audio())return;const t=ac.currentTime;burst(t,.03,1200,1.5,.35);thump(t,110,.05,.35);burst(t+.05,.02,3500,3,.15)},
  thunk(){if(!audio())return;const t=ac.currentTime;thump(t,80,.12,.7);burst(t,.05,500,1,.4)},
  bell(){if(!audio())return;const t=ac.currentTime;[[2093,.35],[4186,.12],[5600,.06],[3140,.08]].forEach(([f,v])=>{const o=ac.createOscillator();o.frequency.value=f;const g=ac.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0008,t+1.6);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+1.7)});burst(t,.01,6000,1,.3)},
  ret(dist){if(!audio())return;const t=ac.currentTime;for(let i=0;i<3;i++)burst(t+i*.035,.025,1800,4,.5);
    const d=.12+dist*.006;burst(t+.12,d,700,.7,.35,'lowpass');thump(t+.12+d,90,.14,.8);burst(t+.12+d,.04,2500,1,.5)},
  lf(){if(!audio())return;const t=ac.currentTime;burst(t,.02,2600,5,.4);burst(t+.03,.02,2400,5,.3)},
  paper(){if(!audio())return;const t=ac.currentTime;for(let i=0;i<14;i++)burst(t+i*.03,.03,1500+Math.random()*800,.8,.25)}
};

/* ================= 기계 배치 ================= */
const PW=(MAXX+MARGIN*2)*U, PH=(TOPL+MAXLINES+3)*LH;
function setBox(id,l,t,w,h){const e=$(id);e.style.left=l+'px';e.style.top=t+'px';if(w!=null)e.style.width=w+'px';if(h!=null)e.style.height=h+'px'}
function build(){
  carriage.style.width=PW+'px';
  setBox('table',PW*.06,150,PW*.88,200);
  setBox('clip',0,0,PW,SY+24);
  paper.style.width=PW+'px';paper.style.height=PH+'px';
  setBox('platen',0,SY+2,PW);
  setBox('kl',-54,SY-9);setBox('kr',PW+2,SY-9);
  setBox('bail',PW*.05,SY+22,PW*.9);
  setBox('scale',MARGIN*U-24,SY+66,MAXX*U+48);
  setBox('rail',-20,SY+86,PW+40);
  setBox('lever',-205,SY+14);
  setBox('rel',PW+26,SY-60);
  // 눈금자
  const sc=$('scale');let h='';
  for(let i=0;i<=MAXX;i++){const x=24+i*U;h+=`<span style="left:${x}px;height:${i%10===0?9:i%5===0?6:3}px"></span>`;if(i%10===0)h+=`<b style="left:${x}px">${i}</b>`}
  sc.innerHTML=h;
  // 활자대(타이프바) 부채꼴
  const P={x:260,y:SY-416},fan=$('fan');let f='';
  for(let i=0;i<44;i++){const a=(26+i*(128/43))*Math.PI/180,c=Math.cos(a),s=Math.sin(a);
    const x1=P.x+c*104,y1=P.y+s*104,x2=P.x+c*270,y2=P.y+s*270;
    f+=`<line x1="${x2}" y1="${y2}" x2="${x1}" y2="${y1}" stroke="url(#bg)" stroke-width="3.2"/><rect x="${x1-4}" y="${y1-6}" width="8" height="12" fill="#3a3a3a" transform="rotate(${a*180/Math.PI-90} ${x1} ${y1})"/>`}
  fan.innerHTML=`<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8e8e8"/><stop offset="1" stop-color="#6a6a6a"/></linearGradient></defs>`+f;
  // 리본
  const rb=$('rib');
  rb.innerHTML=`<line x1="250" y1="452" x2="479" y2="${SY+31}" stroke="#111" stroke-width="9"/><line x1="250" y1="458" x2="479" y2="${SY+37}" stroke="#7d1611" stroke-width="5"/>
  <line x1="750" y1="452" x2="521" y2="${SY+31}" stroke="#111" stroke-width="9"/><line x1="750" y1="458" x2="521" y2="${SY+37}" stroke="#7d1611" stroke-width="5"/>`;
  $('guide').style.top=(SY-12)+'px';
}
function fit(){
  const s=Math.min(1,(innerWidth-6)/1060);
  const sc=$('scaler');sc.style.width=(W*s)+'px';sc.style.height=(956*s+6)+'px';
  $('machine').style.transform=`scale(${s})`;
}
function render(){paper.innerHTML='';els.clear();st.strikes.forEach(drawStrike);move(0)}
function drawStrike(s){const e=document.createElement('span');e.className='s'+(s.c?' red':'');els.set(s,e);styleStrike(s);paper.appendChild(e)}
function styleStrike(s){
  const e=els.get(s);if(!e)return;e.textContent=s.ch;
  e.style.cssText=`left:${(MARGIN+s.x)*U+s.dx}px;top:${(TOPL+s.l)*LH+s.dy}px;width:${s.w*U}px;height:${LH}px;line-height:${LH}px;font-size:${FS}px;opacity:${s.o};transform:rotate(${s.r}deg)`;
}
function move(dur){
  const tx=W/2-(MARGIN+st.x+1)*U;
  carriage.style.transition=dur?`transform ${dur}ms cubic-bezier(.3,.7,.3,1)`:'none';
  carriage.style.transform=`translateX(${tx}px)`;
  const ty=SY-(TOPL+st.line+1)*LH+4;
  paper.style.transition=dur?`transform ${Math.min(dur,160)}ms ease-out`:'none';
  paper.style.transform=`translateY(${ty}px)`;
  status();
}
function status(){
  $('status').textContent=`${st.hangul?'한글':'영문'} · 줄 ${st.line+1}/${MAXLINES} · 칸 ${st.x}/${MAXX}`;
  $('bLang').classList.toggle('on',st.hangul);
  $('bInk').textContent='리본: '+(st.red?'빨강':'검정');
  $('bBs').textContent='백스페이스: '+(st.real?'실제 타자기':'지우기');
  $('bSnd').classList.toggle('on',st.sound);
  document.querySelectorAll('.k[data-c=Lang]').forEach(k=>k.classList.toggle('lit',st.hangul));
  document.querySelectorAll('.k[data-c=ShiftLeft],.k[data-c=ShiftRight]').forEach(k=>k.classList.toggle('lit',shiftSticky));
  if(typeof relabel==='function')relabel();
}
let msgT;function msg(t){const m=$('msg');m.textContent=t;m.classList.add('show');clearTimeout(msgT);msgT=setTimeout(()=>m.classList.remove('show'),1800)}
function lock(t){snd.thunk();stage.classList.remove('shake');void stage.offsetWidth;stage.classList.add('shake');if(t)msg(t)}
/* 타격: 리본이 올라오고, 해당 키의 활자대가 부채꼴에서 튀어 올라 종이를 때림 */
let ORDER=[];
function hit(){
  ribbon.classList.add('hit');setTimeout(()=>ribbon.classList.remove('hit'),70);
  ['sp1','sp2'].forEach(id=>{const e=$(id);e.classList.remove('turn');void e.offsetWidth;e.classList.add('turn')});
  let i=ORDER.indexOf(lastCode);if(i<0)i=Math.floor(Math.random()*ORDER.length);
  const a=(154-(i/(ORDER.length-1))*128)*Math.PI/180,c=Math.cos(a),s=Math.sin(a),P={x:500,y:SY+14};
  const L=$('abl'),R=$('abs'),t0=performance.now(),D=120;
  L.setAttribute('opacity',1);R.setAttribute('opacity',1);
  (function f(now){let t=Math.min(1,(now-t0)/D);const k=t<.45?t/.45:1-(t-.45)/.55;const r=104-k*100;
    const x1=P.x+c*r,y1=P.y+s*r,x2=P.x+c*(r+150),y2=P.y+s*(r+150);
    L.setAttribute('x1',x2);L.setAttribute('y1',y2);L.setAttribute('x2',x1);L.setAttribute('y2',y1);
    R.setAttribute('transform',`translate(${x1} ${y1}) rotate(${a*180/Math.PI-90})`);
    if(t<1)requestAnimationFrame(f);else{L.setAttribute('opacity',0);R.setAttribute('opacity',0)}})(t0);
}
/* ================= 타자 동작 ================= */
const rnd=(a,b)=>a+Math.random()*(b-a);
function canPlace(w){
  if(st.line>=MAXLINES){lock('종이가 끝났어요 — [새 종이]를 끼우세요');return false}
  if(st.x+w>MAXX){lock('줄 끝이에요 — Enter(레버)로 줄을 바꾸세요');return false}
  return true;
}
function newStrike(ch,w){
  const s={l:st.line,x:st.x,ch,w,dx:+rnd(-.7,.7).toFixed(2),dy:+rnd(-.9,.9).toFixed(2),r:+rnd(-1.4,1.4).toFixed(2),o:+rnd(.74,.98).toFixed(2)};
  if(st.red)s.c=1;
  st.strikes.push(s);drawStrike(s);return s;
}
function bell(){if(!bellRung&&st.x>=MAXX-8){bellRung=true;snd.bell()}}
function advance(n){st.x+=n;bell();move(70)}
function commit(){if(cur){const w=cur.w;cur=null;comp=null;hist=[];advance(w)}}

function startSyl(j){
  if(!canPlace(2))return;
  const v=JUNG.includes(j);
  comp={cho:v?'':j,jung:v?j:'',jong:''};hist=[];
  cur=newStrike(syl(comp),2);
}
function jamo(j){
  snd.key();hit();
  if(!cur){startSyl(j);save();return}
  const s=comp,v=JUNG.includes(j),push=()=>hist.push({...s});
  if(!v){
    if(!s.jung){commit();startSyl(j)}
    else if(!s.jong){ if(s.cho&&canJong(j)){push();s.jong=j} else {commit();startSyl(j)} }
    else { const c=JONGC[s.jong+j]; if(c){push();s.jong=c} else {commit();startSyl(j)} }
  }else{
    if(!s.jung){push();s.jung=j}
    else if(!s.jong){ const c=JUNGC[s.jung+j]; if(c){push();s.jung=c} else {commit();startSyl(j)} }
    else{
      if(st.x+4>MAXX){lock('줄 끝이에요 — Enter(레버)로 줄을 바꾸세요');return}
      let mv; const sp=JONGS[s.jong]; if(sp){s.jong=sp[0];mv=sp[1]} else {mv=s.jong;s.jong=''}
      cur.ch=syl(s);styleStrike(cur);commit();
      comp={cho:mv,jung:j,jong:''};hist=[{cho:mv,jung:'',jong:''}];
      cur=newStrike(syl(comp),2);save();return;
    }
  }
  if(cur&&comp){cur.ch=syl(comp);cur.o=+rnd(.78,.98).toFixed(2);styleStrike(cur)}
  save();
}
function typeChar(ch){
  commit();
  if(!canPlace(1))return;
  snd.key();hit();newStrike(ch,1);advance(1);save();
}
function space(){
  commit();
  if(st.line>=MAXLINES){lock('종이가 끝났어요 — [새 종이]를 끼우세요');return}
  if(st.x+1>MAXX){lock('줄 끝이에요 — Enter(레버)로 줄을 바꾸세요');return}
  snd.space();advance(1);save();
}
function tab(){commit();const n=Math.min(MAXX,(Math.floor(st.x/8)+1)*8);if(n===st.x){lock();return}snd.space();st.x=n;bell();move(120);save()}
function ret(){
  commit();
  if(st.line>=MAXLINES){lock('종이가 끝났어요 — [새 종이]를 끼우세요');return}
  const d=st.x;st.x=0;st.line++;bellRung=false;
  lever.classList.remove('pull');void lever.offsetWidth;lever.classList.add('pull');
  snd.ret(d);move(180+d*6);save();
  if(st.line>=MAXLINES)setTimeout(()=>msg('종이가 끝났어요 — [새 종이]를 끼우세요'),400);
}
function back(){
  if(cur){
    if(hist.length){comp=hist.pop();cur.ch=syl(comp);styleStrike(cur)}
    else{removeStrike(cur);cur=null;comp=null}
    snd.space();save();return;
  }
  if(st.x===0){lock();return}
  const prev=[...st.strikes].reverse().find(s=>s.l===st.line&&s.x+s.w===st.x);
  if(st.real){ st.x-=prev?prev.w:1; }
  else{
    // 지우기: 바로 앞 칸의 글자(겹쳐 친 것 포함)를 지움
    const w=prev?prev.w:1; st.x-=w;
    st.strikes.filter(s=>s.l===st.line&&s.x===st.x).forEach(removeStrike);
  }
  if(st.x<MAXX-8)bellRung=false;
  snd.space();move(70);save();
}
function removeStrike(s){const i=st.strikes.indexOf(s);if(i>=0)st.strikes.splice(i,1);const e=els.get(s);if(e)e.remove();els.delete(s)}
function newPaper(){
  commit();st.strikes=[];st.line=0;st.x=0;bellRung=false;paper.innerHTML='';els.clear();snd.paper();
  paper.style.transition='none';paper.style.transform=`translateY(${strikeY+40}px)`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>move(500)));save();
}
function toggleLang(){commit();st.hangul=!st.hangul;snd.lf();status();save()}

/* ================= 입력 처리 ================= */
function press(code,shift,caps){lastCode=code;
  if(code==='Lang'){toggleLang();return}
  if(code==='Backspace'){back();return}
  if(code==='Enter'){ret();return}
  if(code==='Space'){space();return}
  if(code==='Tab'){tab();return}
  if(/^Key[A-Z]$/.test(code)){
    if(st.hangul){jamo(shift&&KOS[code]?KOS[code]:KO[code]);return}
    const c=code.slice(3);typeChar((shift!==!!caps)?c:c.toLowerCase());return;
  }
  if(SYM[code]){typeChar(SYM[code][shift?1:0]);return}
}
addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey)return;
  if(e.target&&e.target.id==='ta')return;
  const code=e.code;
  if(code==='Lang1'||e.key==='HangulMode'||code==='AltRight'||(code==='Space'&&e.shiftKey)){e.preventDefault();if(!e.repeat)toggleLang();flash('Lang');return}
  const ok=code==='Backspace'||code==='Enter'||code==='Space'||code==='Tab'||/^Key[A-Z]$/.test(code)||SYM[code];
  if(code.startsWith('Shift')){shiftHeld=true;relabel();flash(code);return}
  if(!ok)return;
  e.preventDefault();
  if(e.repeat&&code!=='Backspace')return;   // 진짜 타자기엔 자동반복이 없어요
  flash(code);
  press(code,e.shiftKey,e.getModifierState&&e.getModifierState('CapsLock'));
});
let shiftHeld=false;
addEventListener('keyup',e=>{if(e.code.startsWith('Shift')){shiftHeld=false;relabel()}});
addEventListener('blur',()=>{shiftHeld=false;relabel()});

/* ================= 타자기 자판 ================= */
const ROWS=[
  ['Backquote','Digit1','Digit2','Digit3','Digit4','Digit5','Digit6','Digit7','Digit8','Digit9','Digit0','Minus','Equal','Backspace'],
  ['Tab','KeyQ','KeyW','KeyE','KeyR','KeyT','KeyY','KeyU','KeyI','KeyO','KeyP','BracketLeft','BracketRight'],
  ['Lang','KeyA','KeyS','KeyD','KeyF','KeyG','KeyH','KeyJ','KeyK','KeyL','Semicolon','Quote','Enter'],
  ['ShiftLeft','KeyZ','KeyX','KeyC','KeyV','KeyB','KeyN','KeyM','Comma','Period','Slash','ShiftRight']
];
const ROWX=[18,30,14,22], NAMES={Backspace:'뒤로',Tab:'Tab',Enter:'줄바꿈',ShiftLeft:'Shift',ShiftRight:'Shift',Lang:'한/영'};
ORDER=ROWS.flat().filter(c=>!NAMES[c]);
const kb=$('kb'),keyEls={};
function bindKey(k,c){
  k.addEventListener('pointerdown',ev=>{ev.preventDefault();
    if(c==='ShiftLeft'||c==='ShiftRight'){shiftSticky=!shiftSticky;snd.lf();status();return}
    k.classList.add('down');setTimeout(()=>k.classList.remove('down'),110);
    press(c,shiftSticky,false);
    if(shiftSticky&&c!=='Lang'){shiftSticky=false;status()}
  });
}
ROWS.forEach((r,ri)=>{const row=document.createElement('div');row.className='row';row.style.left=ROWX[ri]+'px';row.style.top=(14+ri*58)+'px';
  r.forEach(c=>{const k=document.createElement('div');k.className='k';k.dataset.c=c;
    if(NAMES[c]){k.classList.add('wide');k.innerHTML=`<span class="m">${NAMES[c]}</span>`}
    else k.innerHTML='<span class="sh"></span><span class="m"></span><span class="en"></span>';
    bindKey(k,c);keyEls[c]=k;row.appendChild(k)});
  kb.appendChild(row)});
const sp=document.createElement('div');sp.id='space';sp.dataset.c='Space';bindKey(sp,'Space');keyEls.Space=sp;kb.appendChild(sp);
function relabel(){
  const sh=shiftHeld||shiftSticky;
  for(const c in keyEls){const k=keyEls[c];if(NAMES[c]||c==='Space')continue;
    const m=k.querySelector('.m'),s=k.querySelector('.sh'),en=k.querySelector('.en');
    if(/^Key/.test(c)){const L=c.slice(3);
      if(st.hangul){m.textContent=(sh&&KOS[c])?KOS[c]:KO[c];s.textContent=(!sh&&KOS[c])?KOS[c]:'';en.textContent=L}
      else{m.textContent=sh?L:L.toLowerCase();s.textContent='';en.textContent=KO[c]}
    }else{m.textContent=SYM[c][sh?1:0];s.textContent=sh?'':SYM[c][1];en.textContent=''}
  }
}
function flash(code){const k=keyEls[code];if(!k)return;k.classList.add('down');setTimeout(()=>k.classList.remove('down'),110)}

/* ================= 폰 키보드 (휴대폰 자체 키보드로 입력) ================= */
const ta=$('ta'),SENT='  ';let taPrev=SENT;ta.value=SENT;
function typeAny(ch){
  if(ch==='\n'){ret();return}
  if(ch===' '||ch===' '){space();return}
  const c=ch.charCodeAt(0);
  if((c>=0xAC00&&c<=0xD7A3)||(c>=0x3131&&c<=0x318E)){commit();if(!canPlace(2))return;lastCode='';snd.key();hit();newStrike(ch,2);advance(2);save();return}
  typeChar(ch);
}
function flushTA(){
  const v=ta.value;let i=0;while(i<v.length&&i<taPrev.length&&v[i]===taPrev[i])i++;
  for(let n=taPrev.length-i;n>0;n--)back();
  for(const ch of v.slice(i))typeAny(ch);
  taPrev=v;
  if(v.length<SENT.length||v.length>120){ta.value=SENT;taPrev=SENT}
}
ta.addEventListener('input',e=>{if(e.isComposing)return;flushTA()});
ta.addEventListener('compositionend',()=>setTimeout(flushTA,0));
$('bPhone').onclick=()=>{ta.value=SENT;taPrev=SENT;ta.focus();msg('휴대폰 키보드로 치세요 — 글자가 완성되면 찍혀요')};
/* ================= 버튼 ================= */
$('bLang').onclick=toggleLang;
$('bInk').onclick=()=>{commit();st.red=!st.red;snd.lf();status();save()};
$('bBs').onclick=()=>{st.real=!st.real;status();save()};
$('bSnd').onclick=()=>{st.sound=!st.sound;status();save()};
$('bNew').onclick=()=>{if(!st.strikes.length||confirmNew())newPaper()};
let newArm=0;function confirmNew(){if(Date.now()-newArm<2500)return true;newArm=Date.now();msg('한 번 더 누르면 새 종이로 바꿔요');return false}
lever.addEventListener('pointerdown',e=>{e.preventDefault();ret()});
document.querySelectorAll('.btn').forEach(b=>b.addEventListener('mousedown',e=>e.preventDefault()));
document.querySelectorAll('.btn').forEach(b=>b.addEventListener('click',()=>b.blur()));

function toText(){
  const lines=[];
  for(const s of st.strikes){(lines[s.l]=lines[s.l]||[]).push(s)}
  const out=[];const n=Math.max(st.line+1,lines.length);
  for(let l=0;l<n;l++){const arr=(lines[l]||[]).slice();let str='',x=0;
    const byX=new Map();arr.forEach(s=>byX.set(s.x,s));
    [...byX.values()].sort((a,b)=>a.x-b.x).forEach(s=>{if(s.x<x)return;str+=' '.repeat(s.x-x)+s.ch;x=s.x+s.w});
    out.push(str.replace(/\s+$/,''))}
  return out.join('\n').replace(/\n+$/,'');
}
$('bCopy').onclick=async()=>{commit();const t=toText();
  try{await navigator.clipboard.writeText(t);msg('글을 복사했어요')}
  catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');msg('글을 복사했어요')}catch(_){msg('복사하지 못했어요')}ta.remove()}};
$('bPng').onclick=async()=>{
  commit();
  try{await document.fonts.load(`${FS}px DXType`,'가A')}catch(e){}
  const k=3,u=12,lh=31,fs=22,pw=(MAXX+MARGIN*2)*u,lastL=Math.max(st.line,...st.strikes.map(s=>s.l),0),ph=(TOPL+lastL+4)*lh;
  const cv=document.createElement('canvas');cv.width=pw*k;cv.height=ph*k;const g=cv.getContext('2d');g.scale(k,k);
  g.fillStyle='#f5f0e3';g.fillRect(0,0,pw,ph);
  g.textAlign='center';g.textBaseline='middle';g.font=`${fs}px DXType, Batang, serif`;
  for(const s of st.strikes){g.save();g.globalAlpha=s.o;g.fillStyle=s.c?'#b3261e':'#1c1a1e';
    g.translate((MARGIN+s.x+s.w/2)*u+s.dx,(TOPL+s.l)*lh+lh/2+s.dy+1);g.rotate(s.r*Math.PI/180);g.fillText(s.ch,0,0);g.restore()}
  const a=document.createElement('a');a.download='typekr.png';a.href=cv.toDataURL('image/png');a.click();msg('그림으로 저장했어요');
};

/* ================= 시작 ================= */
addEventListener('resize',fit);
build();fit();
document.fonts&&document.fonts.load('22px DXType','가A').finally(render);
render();relabel();status();
if(!st.strikes.length)setTimeout(()=>msg('아무 키나 눌러 타자를 시작하세요'),600);
})();
</script>
</body>
